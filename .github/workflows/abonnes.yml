name: Mise à jour des abonnés

on:
  schedule:
    - cron: "0 5 1 * *"   # le 1er de chaque mois, vers 6 h (heure de Paris)
  workflow_dispatch:       # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write
  pages: write

jobs:
  abonnes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer les abonnés
        env:
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scripts/maj-abonnes.js
      - name: Publier sur le site
        run: |
          if git diff --quiet js/data.js; then
            echo "Aucun changement à publier."
          else
            git config user.name "Bloom (mise à jour automatique)"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add js/data.js
            git commit -m "Abonnés du mois : mise à jour automatique"
            git push
            curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          fi
      - name: Prévenir si un chiffre est à vérifier
        run: |
          if [ -f alertes.txt ]; then
            echo "::warning::Certains chiffres n'ont pas été mis à jour, voir ci-dessous."
            cat alertes.txt
            exit 1
          fi
