  <style>

    :root{--navy:#1C1838;--lav:#8A80C0;--lav2:#C9C2EE}

    html{min-height:100%;background:#2A2452 url(img/fond-mobile.jpg) center top/cover no-repeat}

    a{color:#fff;text-decoration:none}
    .w{font-family:"Archivo",sans-serif;font-weight:900;font-stretch:112%}

    main{max-width:430px;margin:0 auto;padding:40px 22px 36px;display:flex;flex-direction:column;align-items:center;gap:14px}
    .avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:5px 5px 0 var(--lav)}
    h1{margin:10px 0 0;font-family:"Archivo",sans-serif;font-weight:900;font-stretch:125%;font-size:50px;line-height:1;letter-spacing:-1px;text-shadow:4px 4px 0 var(--lav)}
    .abos{margin:-6px 0 0;padding:5px 14px;border-radius:8px;background:var(--lav);font-size:14px;letter-spacing:1px}

    .mail{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:#fff;color:var(--navy);font-weight:700;font-size:14px;transition:transform .12s}
    .mail:hover{color:var(--navy);transform:translateY(-2px)}

    .list{width:100%;display:flex;flex-direction:column;gap:11px;margin:6px 0 0;padding:0;list-style:none}
    .btn{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 14px;border-radius:14px;background:rgba(22,19,52,.78);border:1.5px solid var(--lav);transition:transform .12s,background .12s}
    .btn:hover{transform:translateY(-2px);background:rgba(22,19,52,.9)}
    .btn:focus-visible,.mail:focus-visible{outline:3px solid var(--lav2);outline-offset:3px}
    .chip{width:38px;height:38px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .txt{display:flex;flex-direction:column;flex-grow:1;min-width:0}
    .t{font-size:15px;letter-spacing:.3px;line-height:1.2}
    .s{font-size:13px;font-weight:600;color:var(--lav2)}

    h2{margin:10px 0 -2px;font-size:15px;letter-spacing:1px}
    .sponso{width:100%;display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 14px;border-radius:14px;background:var(--lav2);color:var(--navy);transition:transform .12s}
    .sponso:hover{color:var(--navy);transform:translateY(-2px)}
    .sponso img{width:40px;height:40px;flex-shrink:0;border-radius:10px;object-fit:cover;background:#fff}
    .sponso .row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;column-gap:10px;row-gap:4px;flex-grow:1;min-width:0}
    .code{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--navy);color:#fff;white-space:nowrap}
    @media (prefers-reduced-motion:reduce){.btn,.mail,.sponso{transition:none}}
  </style>

<script src="/js/data.js"></script>
<script>
  /* Abonnés cumulés : repris des chiffres du site Bloom (mis à jour automatiquement le 1er de chaque mois) */
  (function () {
    try {
      var t = (window.BLOOM && window.BLOOM.talents || []).filter(function (x) { return x.nom === "Darick"; })[0];
      if (!t) return;
      var total = t.plateformes.reduce(function (s, p) { return s + (Number(p.abonnes) || 0); }, 0);
      if (!total) return;
      var el = document.getElementById("total");
      var fmt = function (n) { return n >= 1e6 ? (Math.round(n / 1e5) / 10).toString().replace(".", ",") + "M" : Math.round(n / 1000) + "K"; };
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = fmt(total); return; }
      var debut = null, duree = 1200;
      requestAnimationFrame(function pas(ts) {
        if (!debut) debut = ts;
        var k = Math.min(1, (ts - debut) / duree), e = 1 - Math.pow(1 - k, 3);
        el.textContent = fmt(total * e);
        if (k < 1) requestAnimationFrame(pas);
      });
    } catch (e) { /* le chiffre écrit dans la page reste affiché */ }
  })();
</script>
