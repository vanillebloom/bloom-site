  <style>
    @font-face{font-family:"Anton";src:url(/fonts/anton-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
    @font-face{font-family:"Outfit";src:url(/fonts/outfit-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
    @font-face{font-family:"Outfit";src:url(/fonts/outfit-latin-700-normal.woff2) format("woff2");font-weight:700 800;font-display:swap}

    :root{--ink:#120B1C;--accent:#7B3FE4;--muted:#54466A}
    *{box-sizing:border-box}
    html{min-height:100%;background:#120B1C}
    body{margin:0;min-height:100vh;font-family:"Outfit",system-ui,sans-serif;color:var(--ink);background:radial-gradient(120% 60% at 50% 0%,#4B2A86 0%,#1E1236 55%,#120B1C 100%) no-repeat #120B1C;-webkit-font-smoothing:antialiased}
    a{color:var(--ink);text-decoration:none}

    main{max-width:430px;margin:0 auto;padding:40px 22px 36px;display:flex;flex-direction:column;align-items:center;gap:14px}
    .avatar{width:108px;height:108px;border-radius:50%;object-fit:cover;border:4px solid var(--ink);outline:4px solid #fff;background:#fff}
    h1{margin:4px 0 0;font-family:"Anton",sans-serif;font-weight:400;font-size:64px;line-height:1;letter-spacing:1px;color:#fff;-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff)}
    .abos{margin:0;padding:5px 14px;border-radius:8px;background:var(--accent);color:#fff;border:2px solid #fff;font-family:"Anton",sans-serif;font-size:17px;letter-spacing:1px}

    .mail{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:#fff;color:var(--ink);border:2px solid var(--ink);font-weight:700;font-size:14px;transition:transform .12s}
    .mail:hover{color:var(--ink);transform:translateY(-2px)}

    .list{width:100%;display:flex;flex-direction:column;gap:11px;margin:6px 0 0;padding:0;list-style:none}
    .btn{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 14px;border-radius:16px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
    .btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
    .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
    .btn:focus-visible,.mail:focus-visible{outline:3px solid #E0C9FE;outline-offset:3px}
    .chip{width:38px;height:38px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .chip img{width:100%;height:100%;object-fit:cover;display:block}
    .txt{display:flex;flex-direction:column;flex-grow:1;min-width:0}
    .t{font-family:"Anton",sans-serif;font-size:19px;letter-spacing:.5px;line-height:1.15}
    .s{font-size:13px;font-weight:600;color:var(--muted)}

    h2{margin:10px 0 -2px;font-family:"Anton",sans-serif;font-weight:400;font-size:19px;letter-spacing:1px;color:#fff}
    .sponso{background:#E0C9FE;color:var(--ink);justify-content:space-between}
    .sponso:hover{color:var(--ink)}
    .sponso .left{display:flex;align-items:center;gap:12px;min-width:0}
    .sponso .chip{border:2px solid var(--ink);background:#fff}
    .code{flex-shrink:0;font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;background:var(--ink);color:#fff;border:2px solid var(--ink)}
    @media (max-width:360px){.sponso{flex-wrap:wrap}.code{margin-left:50px}}
    @media (prefers-reduced-motion:reduce){.btn,.mail{transition:none}}
  </style>
</head>

<script src="/js/data.js"></script>
<script>
  /* Abonnés cumulés : repris des chiffres du site Bloom (mis à jour automatiquement le 1er de chaque mois) */
  (function () {
    try {
      var t = (window.BLOOM && window.BLOOM.talents || []).filter(function (x) { return x.nom === "M2zoo"; })[0];
      if (!t) return;
      var total = t.plateformes.reduce(function (s, p) { return s + (Number(p.abonnes) || 0); }, 0);
      if (!total) return;
      var el = document.getElementById("total");
      var fmt = function (n) { return n >= 1e6 ? (Math.round(n / 1e5) / 10).toString().replace(".", ",") + "M" : Math.round(n / 1000) + "K"; };
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = fmt(total); return; }
      var debut = null, duree = 1200;
      requestAnimationFrame(function pas(ts) {
        if (!debut) debut = ts;
        var k = Math.min(1, (ts - debut) / duree), e = 1 - Math.pow(1 - k, 3);
        el.textContent = fmt(total * e);
        if (k < 1) requestAnimationFrame(pas);
      });
    } catch (e) { /* le chiffre écrit dans la page reste affiché */ }
  })();
</script>
